
<!-- Inside a post content close to TOC -->
<div class="tags">
  <i class="fa-solid fa-feather"></i>
    {{- range $index, $el := . -}}
    {{- if gt $index 0 }}
      <span class="separator">•</span>
    {{- end }}
    <span class="tag">
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    </span>
  {{- end -}}
</div>
