baseurl = "http://blog.adriencaubel.fr"
title = "Adrien CAUBEL"
theme = "coder"
languagecode = "en"
defaultcontentlanguage = "en"

pagination.pagerSize = 20

[services]
[services.disqus]
disqusShortname = "yourdiscussshortname"

[markup.highlight]
style = "monokailight"

[params]
  author = "Adrien CAUBEL"
  info = "Signature of [adriencaubel.fr](https://adriencaubel.fr ) website"
  description = "Adrien Caubel's personal blog"
  keywords = "blog,developer,personal,adrien caubel"
  #avatarurl = "images/avatar.jpg"
  #gravatar = "john.doe@example.com"

  faviconSVG = "/img/favicon.svg"
  favicon_32 = "/img/favicon-32x32.png"
  favicon_16 = "/img/favicon-16x16.png"

  since = 2021

  enableTwemoji = true

  colorScheme = "auto"
  hidecolorschemetoggle = false

  customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

